[project]
name = "daybyday-agent"
version = "0.1.0"
description = "Day by Day 桌面宠物的 agent 后端：日程与任务管理、主动提醒、复盘与报告。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sse-starlette>=2.1",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "apscheduler>=3.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "store", "agent", "collectors", "scheduler", "api", "common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖在参数默认值里调用 Security/HTTPBearer/Depends，是框架惯用法。
"api/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "store", "agent", "collectors", "scheduler", "api", "common"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true

[[tool.mypy.overrides]]
module = ["core.*", "store.*", "agent.*"]
strict = true

[[tool.mypy.overrides]]
module = ["collectors.*", "scheduler.*", "api.*"]
check_untyped_defs = true

# 分层约束：core 纯函数域禁依赖外部（spec/backend/quality-guidelines.md §1）
[tool.importlinter]
root_package = "core"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core must not import agent/store/api/collectors/scheduler or langchain"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "agent",
    "store",
    "api",
    "collectors",
    "scheduler",
    # langchain 生态以多个独立发行包存在（langchain_core / langchain_openai / langgraph），
    # 各自是顶层模块，必须逐一禁止——只写 "langchain" 拦不住 langchain_core。
    "langchain",
    "langchain_core",
    "langchain_openai",
    "langgraph",
]
